{% extends 'mainapp/base.html' %}

{% block title %}Delete Skill — Campus SkillSwap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm text-center">
            <div class="card-body p-4">
                <h2 class="text-danger mb-3">&#9888; Delete Skill Post</h2>
                <p class="fs-5">Are you sure you want to delete:</p>
                <p class="fw-bold fs-4">{{ object.title }}</p>
                <p class="text-muted">This action cannot be undone.</p>

                <!--
                    DeleteView requires a POST form — a GET link would be a security risk
                    because bots or browser prefetching could trigger accidental deletions.
                -->
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <button type="submit" class="btn btn-danger">Yes, Delete It</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
