services:
  - type: web
    name: campus-skillswap
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn campus_skillswap.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-skillswap-db
          property: connectionString

databases:
  - name: campus-skillswap-db
    databaseName: campus_skillswap
    user: campus_skillswap
